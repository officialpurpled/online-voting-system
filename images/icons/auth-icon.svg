<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#221d7b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Rectangular Ballot Box Base -->
  <rect x="3" y="11" width="18" height="8.5" rx="1" fill="#221d7b" stroke="#221d7b" />
  
  <!-- Flat Rectangular Lid Slot -->
