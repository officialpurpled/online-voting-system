<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="../css/signup.css">
</head>
<style>
  .loginMain{
    padding-top: 0;
    padding-bottom: 0;
  }
</style>
<body>
  <header>
    <div class="left-section">
      <img src="../images/logo.png" alt="Logo">
    </div>
    <div class="right-section">
      <a href="../index.html">
        Home
      </a>
      <a href="login.html">
        Login
      </a>
    </div>
  </header>

  <main class="loginMain">
    <div class="form-container">
      <div class="title"> RESET PASSWORD </div>
      <div class="form">
        <label for="email"> Email:
          <input type="email" name="email" id="email" class="email">
        </label>
        <label for="matric"> Matric/Reg No:
          <input type="text" name="matric" id="matricNo" class="matric">
        </label>
        <label for="password"> New Password:
          <input type="password" id="password" name="password"  class="password">
        </label>
        <div id="message" style="display: none;"></div>
        <button class="reset">RESET</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/dayjs@1.11.19/dayjs.min.js"></script>
  <script src="../script/authenticate/reset.js" type="module"> </script>
</body>
</html>
