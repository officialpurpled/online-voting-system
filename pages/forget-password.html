<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="../css/signup.css">
</head>
<style>
  .loginMain {
    padding-top: 0;
    padding-bottom: 0;
  }
</style>

<body>
  <header>
    <div class="left-section">
      <a class="brand-box" href="dashboard.html">
        <img src="../images/logo.png" alt="Secure Campus Voting">
      </a>
    </div>
    <div class="right-section">
      <div class="menu-list">
        <span class="menu-item">
          <a href="../index.html">
            <i data-lucide="home" class="h-icon"></i>
            Home
          </a>
        </span>
        <span class="menu-item">
          <a href="about.html">
            <i data-lucide="circle-help" class="h-icon"></i>
            About
          </a>
        </span>
        <span class="menu-item">
          <a href="signup.html">
            <i data-lucide="user-plus" class="h-icon"></i>
            Sign Up
          </a>
        </span>
        <span class="menu-item">
          <a href="login.html">
            <i data-lucide="log-in" class="h-icon"></i>
            Log In
          </a>
        </span>
      </div>
      <div class="menu-icon">
        <i data-lucide="menu"></i>
      </div>
    </div>
  </header>

  <main class="loginMain">
    <div class="form-container">
      <div class="title"> RESET PASSWORD </div>
      <div class="form">
        <label for="email"> Email:
          <input type="email" name="email" id="email" class="email">
        </label>
        <label for="matric"> Matric/Reg No:
          <input type="text" name="matric" id="matricNo" class="matric">
        </label>
        <label for="password"> New Password:
          <input type="password" id="password" name="password" class="password">
        </label>
        <div id="message" style="display: none;"></div>
        <button class="reset">RESET</button>
      </div>
    </div>
  </main>

  <script src="../lib/lucide.js"></script>
  <script src="../script/authenticate/reset.js" type="module"> </script>
</body>

</html>
