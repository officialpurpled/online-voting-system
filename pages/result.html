<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Election Results</title>
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/result.css">
  <link rel="stylesheet" href="../css/mediaquery.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
 <body>
  <header>
    <div class="left-section">
      <img src="../images/logo.png" alt="Logo" width="50%">
    </div>
    <div class="right-section">
      <div class="profile-abstract">
        <div class="avatar"> 
          <img src="../images/icons/user.svg" >
        </div>

        <div style="display: flex; flex-direction: column;" id="ab-user-info">
          <p>${user.username}</p>
          <p>${user.studentId}</p>
        </div>
      </div>
      <div class="menu-icon">
        <img src="../images/icons/menu-nav.svg" alt="">
      </div>
    </div>
  </header>

  <nav>
    <a href="dashboard.html">
      <img src="../images/icons/home.svg" alt="Dashboard">
      Dashboard
    </a>

    <a href="#" class="active">
      <img src="../images/icons/history.svg" alt="View results">
      View Result
    </a>

    <a href="profile.html">
      <img src="../images/icons/user.svg" alt="Profile">
      My Profile
    </a> 

    <a id="logout">
      Log Out
      <img src="../images/icons/download.svg" alt="Log out">
    </a> 
  </nav>

  <main id="results">
    <div class="departmental resultTab"> 
      DEPARTMENTAL RESULT TAB
    </div>
    <section id="dept-modal">
      <!-- Dynamic post sections will be inserted here -->
    </section>

    <div class="faculty resultTab"> 
      FACULTY RESULT TAB
    </div>
    <section id="faculty-modal">
      <!-- Dynamic post sections will be inserted here -->
    </section>

    <div class="sug resultTab"> 
      SUG RESULT TAB
    </div>
    <section id="sug-modal">
      <!-- Dynamic post sections will be inserted here -->
    </section>

  </main>

  <footer>
    <div>
      2026 Copyright, Purple Dragon 
    </div>
  </footer>

  <!-- <script src="../script/result.js" type="module"></script> -->
   <script type="module" src="../script/fetchResult.js"></script>
</body>
</html>
