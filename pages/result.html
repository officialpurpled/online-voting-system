<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Election Results</title>
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/result.css">
  <link rel="stylesheet" href="../css/mediaquery.css">
  <link rel="stylesheet" href="../fonts/poppins/stylesheet.css">
</head>

<body>
  <header>
    <div class="left-section">
      <a class="brand-box" href="dashboard.html">
        <img src="../images/logo.png" alt="Secure Campus Voting">
      </a>
    </div>
    <div class="right-section">
      <div class="menu-list">
        <span class="menu-item">
          <a href="dashboard.html">
            <i data-lucide="layout-dashboard" class="h-icon"></i>
            Dashboard
          </a>
        </span>
        <span class="menu-item">
          <a href="result.html" class="active">
            <i data-lucide="chart-no-axes-column-increasing" class="h-icon"></i>
            Results
          </a>
        </span>
        <span class="menu-item">
          <a href="profile.html">
            <i data-lucide="user-round" class="h-icon"></i>
            My Profile
          </a>
        </span>
        <span class="menu-item">
          <a id="logout">
            <i data-lucide="log-out" class="h-icon"></i>
            Log Out
          </a>
        </span>
      </div>
      <div class="menu-icon">
        <i data-lucide="menu"></i>
      </div>
    </div>
  </header>

  <nav>
    <a href="dashboard.html">
      <img src="../images/icons/home.svg" alt="Dashboard">
      Dashboard
    </a>

    <a href="#" class="active">
      <img src="../images/icons/history.svg" alt="View results">
      View Result
    </a>

    <a href="profile.html">
      <img src="../images/icons/user.svg" alt="Profile">
      My Profile
    </a>

    <a id="logout">
      Log Out
      <img src="../images/icons/download.svg" alt="Log out">
    </a>
  </nav>

  <main id="results">
    <div id="notisModal" class="notisModal" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="departmental resultTab">
      DEPARTMENTAL RESULT TAB
    </div>
    <section id="dept-modal">
      <!-- Dynamic post sections will be inserted here -->
    </section>

    <div class="faculty resultTab">
      FACULTY RESULT TAB
    </div>
    <section id="faculty-modal">
      <!-- Dynamic post sections will be inserted here -->
    </section>

    <div class="sug resultTab">
      SUG RESULT TAB
    </div>
    <section id="sug-modal">
      <!-- Dynamic post sections will be inserted here -->
    </section>

  </main>

  <script src="../lib/lucide.js"></script>
  <script type="module" src="../script/fetchResult.js"></script>
</body>

</html>
