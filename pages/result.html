  <main id="results">
    <div id="notisModal" class="notisModal"></div>

    <div class="results-shell">

      <div class="results-summary">
        Results are published for faculty, departmental, and student union elections.
      </div>

      <div class="results-filters">
        <button type="button" class="result-filter-btn active" data-filter="all">All</button>
        <button type="button" class="result-filter-btn" data-filter="department">Departmental</button>
        <button type="button" class="result-filter-btn" data-filter="faculty">Faculty</button>
        <button type="button" class="result-filter-btn" data-filter="sug">SUG</button>
      </div>

      <section id="dept-modal" class="result-collection" data-mode="department">
        <!-- Dynamic post sections will be inserted here -->
      </section>

      <section id="faculty-modal" class="result-collection" data-mode="faculty">
        <!-- Dynamic post sections will be inserted here -->
      </section>

      <section id="sug-modal" class="result-collection" data-mode="sug">
        <!-- Dynamic post sections will be inserted here -->
      </section>
    </div>
  </main>

  <footer>
    <div>
