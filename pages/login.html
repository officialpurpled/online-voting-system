<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/mediaquery.css">
</head>
<style>
  .loginMain {
    padding-top: 0;
    padding-bottom: 72px;
  }
</style>

<body>
  <header>
    <div class="left-section">
      <a class="brand-box" href="dashboard.html">
        <img src="../images/logo.png" alt="Secure Campus Voting">
      </a>
    </div>
    <div class="right-section">
      <div class="menu-list">
        <span class="menu-item">
          <a href="../index.html">
            <i data-lucide="home" class="h-icon"></i>
            Home
          </a>
        </span>
        <span class="menu-item">
          <a href="about.html">
            <i data-lucide="circle-help" class="h-icon"></i>
            About
          </a>
        </span>
        <span class="menu-item">
          <a href="signup.html">
            <i data-lucide="user-plus" class="h-icon"></i>
            Sign Up
          </a>
        </span>
        <span class="menu-item">
          <a class="active">
            <i data-lucide="log-in" class="h-icon"></i>
            Log In
          </a>
        </span>
      </div>
      <div class="menu-icon">
        <i data-lucide="menu"></i>
      </div>
    </div>
  </header>

  <main class="loginMain">
    <div class="form-container">
      <div class="form-header">
        <i data-lucide="shield-check" class="form-icon" aria-hidden="true"></i>
        <h1>Welcome Back</h1>
        <p>Login with your student credetials, to securely vote for the candidate of your choice.</p>
      </div>
      <form id="loginForm">
        <label for="matric"> Matric/Reg No: </label>
        <div class="input-group">
          <span class="field-icon"><i data-lucide="user-round" aria-hidden="true"></i></span>
          <input type="text" name="matric" id="matricNo" class="matric" placeholder="Enter your matriculation number">
        </div>

        <label for="password"> Password: </label>
        <div class="input-group">
          <span class="field-icon"><i data-lucide="lock-keyhole" aria-hidden="true"></i></span>
          <input type="password" id="password" name="password" class="password" placeholder="Enter your password">
          <button type="button" class="password-toggle" aria-label="Show password">
            <i data-lucide="eye" aria-hidden="true"></i>
          </button>
        </div>

        <div id="message" style="display: none;"></div>

        <p class="forget-password"><a href="forget-password.html"> Forget password? </a></p>
        <button type="submit" class="loginBtn">
          <span class="btn-text">
            Log In
          </span>
          <i class="fas fa-spinner fa-spin" style="display: none;"></i>
          <i data-lucide="log-in" class="login-arrow" aria-hidden="true"></i>
        </button>
      </form>
      <div class="divider">
        <hr>
        OR
        <hr>
      </div>
      <div class="redirector">
        <p style="color: rgb(86, 86, 87);"> Don't have an account yet? <a href="signup.html"
            style="margin-left: 2px;">Sign up</a>
        </p>
        <p class="form-footer"><i data-lucide="lock-keyhole" aria-hidden="true"></i> Your credentials are secure handle
        </p>
      </div>
    </div>
  </main>

  <footer>
    <div>
      <span> Copyright &copy;2026 OOU Secure Voting System</span>
      <span class="footer-separator"></span>
      <span class="footer-system">
        <i data-lucide="terminal"></i>
        <span>
          <p> Developed by </p>
          <a href="http://github.com/officialpurpled/profile/" target="_blank" title="github">
            Purple Dragon
          </a>
        </span>
      </span>
    </div>
  </footer>

  <script src="../lib/lucide.js"></script>
  <script src="../script/authenticate/login.js" type="module"></script>
</body>

</html>
